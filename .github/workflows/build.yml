name: 打包UU加速器

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: luci-app-uugamebooster
  PACKAGE_DIR: luci-app-uugamebooster
  TZ: Asia/Shanghai

permissions:
  contents: write
  
jobs:
  Compile:
    name: 打包 ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: apk, sdk_url: "https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst", sdk_tar: "SNAPSDK.tar.zst", sdk_dir: "SNAPSDK", artifact_pattern: "luci-app-uugamebooster-*.apk" }
    steps:
      - name: 检出源码
        uses: actions/checkout@main

      - name: 安装依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install curl git tar zstd python3 python3-pyelftools python3-setuptools

      - name: 下载 SDK
        run: |
          mkdir -p tmp
          curl -SLk --connect-timeout 30 --retry 2 "${{ matrix.target.sdk_url }}" -o "./tmp/${{ matrix.target.sdk_tar }}"
          cd tmp
          tar -I zstd -xf "${{ matrix.target.sdk_tar }}"
          mv openwrt-sdk-* "${{ matrix.target.sdk_dir }}"

      - name: 复制源码到 SDK
        run: |
          mkdir -p "tmp/${{ matrix.target.sdk_dir }}/package/${PACKAGE_NAME}"
          cp -a "${PACKAGE_DIR}/." "tmp/${{ matrix.target.sdk_dir }}/package/${PACKAGE_NAME}/"

      - name: 安装 feeds
        run: |
          cd tmp/${{ matrix.target.sdk_dir }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          echo "CONFIG_PACKAGE_${PACKAGE_NAME}=m" >> .config

      - name: 编译 UU加速器
        run: |
          cd tmp/${{ matrix.target.sdk_dir }}
          make "package/${PACKAGE_NAME}/compile" V=99

      - name: 上传产物
        uses: actions/upload-artifact@main
        with:
          name: uugamebooster-${{ matrix.target.name }}
          path: tmp/${{ matrix.target.sdk_dir }}/bin/packages/aarch64_cortex-a53/base/${{ matrix.target.artifact_pattern }}

  Release:
    runs-on: ubuntu-latest
    needs: [Compile]
    steps:
      - name: 检出源码
        uses: actions/checkout@main

      - name: 获取版本号
        id: version
        run: |
          VERSION="$(awk -F ':=' '/^PKG_VERSION:=/ { print $2; exit }' "./${PACKAGE_DIR}/Makefile")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date '+%Y年%m月%d日%H:%M:%S' | jq -sRr @uri)" >> $GITHUB_ENV

      - name: 下载 APK 产物
        uses: actions/download-artifact@main
        with:
          name: uugamebooster-apk
          path: ./

      - name: 创建 Release
        uses: lmq8267/action-gh-release@master
        with:
          tag_name: ${{ steps.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
             > ### ![](https://img.shields.io/badge/%E7%BC%96%E8%AF%91%E6%97%B6%E9%97%B4-${{ env.build_time }}-8267?logo=github&labelColor=%E9%A1%BB)![](https://img.shields.io/github/downloads/${{ github.repository }}/${{ steps.version.outputs.version }}/total?label=%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&logo=github) 

             - **[luci-app-uugamebooster-1.1-r1.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/luci-app-uugamebooster-${{ steps.version.outputs.version }}-r1.apk) 是OpenWrt新版的APK包** 安装时要加跳过证书验证命令 `--allow-untrusted` 例如：
             ```
              apk add --allow-untrusted luci-app-uugamebooster-${{ steps.version.outputs.version }}-r1.apk
             ```
             
          files: |
            luci-app-uugamebooster-*.apk
